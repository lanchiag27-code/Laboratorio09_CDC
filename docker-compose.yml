
services:
  postgres:
    image: postgres:16
    container_name: lab09-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: ventasdb
    ports:
      - "5432:5432"
    command:
      - postgres
      - -c
      - wal_level=logical
    volumes:
      - postgres_data:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:3.9.1
    container_name: lab09-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  debezium:
    image: quay.io/debezium/connect:3.0
    container_name: lab09-debezium
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: lab09-connect
      CONFIG_STORAGE_TOPIC: lab09_connect_configs
      OFFSET_STORAGE_TOPIC: lab09_connect_offsets
      STATUS_STORAGE_TOPIC: lab09_connect_statuses
    depends_on:
      - kafka
      - postgres

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: lab09-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: laboratorio09
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka

  floci:
    image: floci/floci:latest
    container_name: lab09-floci
    ports:
      - "4566:4566"
    environment:
      FLOCI_HOSTNAME: floci

  consumer:
    image: python:3.11-slim
    container_name: lab09-consumer
    working_dir: /app
    volumes:
      - ./consumer:/app
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      KAFKA_TOPIC: lab09.public.ventas
      S3_ENDPOINT: http://floci:4566
      S3_BUCKET: ucv-data-lake
      PYTHONUNBUFFERED: "1"
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             python consumer.py"
    depends_on:
      - kafka
      - floci

volumes:
  postgres_data:
